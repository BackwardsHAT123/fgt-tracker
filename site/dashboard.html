<title>FGT Tracker</title>
<meta name="color-scheme" content="light dark">
<script>
  /* Theme: the visitor's own choice (saved by the toggle) wins; otherwise follow the device's light/dark setting;
     devices with no setting get light. */
  (function () {
    var t = null;
    try { var v = localStorage.getItem("fgt-theme"); if (v === "light" || v === "dark") t = v; } catch (e) {}
    if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="sitebar.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="favicon.png">
<style>
  /* TAH design system (same tokens as the entry page): Barlow Condensed headings + Inter text, pill buttons and chips, hairline cards, no shadows.
     Dark by default; light via the toggle. Point-level colours and the tracker's green/purple/blue are Tom's own. */
  :root {
    color-scheme: dark;
    --surface: #262524; --raised: #1c1a17; --ink: #f2eee8; --muted: #b3b2ae;
    --hair: #3a3733; --border: #8a877d;
    --accent: #ed7437; --on-accent: #121310; --accent-text: #ed7437;
    --success: #79bc76; --on-success: #121310; --danger: #ea6275; --amber: #eaa945;
    --green: #79d27e; --green-bar: #4fa653; --green-tint: #243026;
    --purple: #c39bf0; --purple-bar: #9a63d1; --purple-tint: #2d2535;
    --blue: #6db3ff; --blue-bar: #4c9aef; --blue-tint: #222d3a;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --head: "Barlow Condensed", "Arial Narrow", sans-serif;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
    --radius-md: 12px; --radius-pill: 999px;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --surface: #f2eee8; --raised: #fbf9f5; --ink: #121310; --muted: #5a574e;
    --hair: #d9d3c8; --border: #8d887b;
    --accent-text: #a8420f; --success: #38763a; --on-success: #fffeff; --danger: #b3263d;
    --green: #2f7d32; --green-bar: #7cc27e; --green-tint: #e5eedf;
    --purple: #5b1a8b; --purple-bar: #8e4fc0; --purple-tint: #eee7f4;
    --blue: #1f6fd6; --blue-bar: #6fb2f2; --blue-tint: #e3edf8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 400 16px/24px var(--sans); }
  a { color: var(--accent-text); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 var(--space-4) 64px; }
  header.pagehd { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); padding: 24px 0 var(--space-3); }
  h1 { margin: 0; font-size: 44px; line-height: 48px; font-weight: 700; letter-spacing: -0.5px; }
  @media (max-width: 700px) { h1 { font-size: 30px; line-height: 34px; } }
  button, select, input { font-family: var(--sans); }
  .btn { font: 600 15px/20px var(--sans); cursor: pointer; border-radius: var(--radius-pill); padding: 6px 18px; min-height: 36px;
    border: 1px solid var(--border); background: transparent; color: var(--ink); white-space: nowrap; }
  .btn:hover { border-color: var(--ink); }
  input:focus-visible, button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }
  .banner { padding: 10px var(--space-4); margin-bottom: var(--space-3); font-size: 15px; line-height: 20px; border-radius: var(--radius-md); }
  .banner.demo { background: var(--amber); color: var(--on-accent); }
  .banner.info { background: var(--raised); border: 1px solid var(--hair); }
  .banner.bad { background: var(--raised); border: 1px solid var(--danger); color: var(--danger); }
  #nav button { font: 500 15px/20px var(--sans); cursor: pointer; color: var(--ink); background: transparent;
    border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 6px 16px; min-height: 34px; }
  #nav button:hover { border-color: var(--ink); }
  #nav button.on { background: var(--success); color: var(--on-success); border-color: var(--success); font-weight: 600; }
  /* Tabs in two rows: groups (pills), then the tabs inside the chosen group (underlined text). */
  #nav { display: block; margin: var(--space-3) 0 var(--space-3); }
  #nav .grp { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  #nav .sub { display: flex; gap: 4px 18px; flex-wrap: wrap; margin-top: 10px; padding-bottom: 2px; border-bottom: 1px solid var(--hair); }
  #nav .sub button { border: 0; border-radius: 0; padding: 6px 2px; min-height: 0; background: transparent; color: var(--muted);
    border-bottom: 3px solid transparent; font-weight: 500; }
  #nav .sub button.on { background: transparent; color: var(--ink); border-bottom-color: var(--success); font-weight: 600; }
  @media (max-width: 600px) {
    #nav .sub { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #nav .sub button { white-space: nowrap; }
  }
  input[type=search], select.picker {
    font: inherit; font-size: 15px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-md); padding: 7px 12px; }
  input::placeholder { color: var(--muted); opacity: 1; }
  select.picker { max-width: 55%; padding: 5px 10px; }

  /* Tracker: three coloured columns */
  .green { --c: var(--green); --c-bar: var(--green-bar); --c-tint: var(--green-tint); }
  .purple { --c: var(--purple); --c-bar: var(--purple-bar); --c-tint: var(--purple-tint); }
  .blue { --c: var(--blue); --c-bar: var(--blue-bar); --c-tint: var(--blue-tint); }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }   /* minmax(0,...) keeps long names from widening a column */
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
  .hd { height: 40px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .hd h2 { font-size: 18px; line-height: 24px; font-weight: 600; margin: 0; color: var(--c); }
  .top { height: 268px; display: flex; flex-direction: column; margin-bottom: var(--space-1); border-bottom: 1px solid var(--hair); }
  .top .card { min-height: 0; overflow: hidden; }
  .card { padding: 14px 10px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center;
    background: var(--c-tint); border: 1px solid var(--hair); border-radius: var(--radius-md); }
  .card .team { font-size: 22px; line-height: 28px; font-weight: 700; color: var(--c); }
  .card .small { font-size: 14px; color: var(--muted); }
  .card .big { font-size: 22px; line-height: 28px; font-weight: 700; color: var(--c); }
  .spark { display: block; width: 100%; height: 56px; margin: 0; flex: none; }
  .cap { flex: none; text-align: center; font-size: 13px; line-height: 16px; color: var(--muted); padding: 2px 0; }
  @media (min-width: 861px) { .col .cap { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.1px; } }
  .bars { margin-top: 0; }
  .bar { display: grid; grid-template-columns: 38% 1fr; align-items: center; gap: 8px; height: 34px; padding: 0 4px; font-size: 14px; }
  .bar:nth-child(odd) { background: color-mix(in srgb, var(--hair) 45%, transparent); }
  .bar .lab { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { display: flex; align-items: center; gap: 6px; }
  .bar .fill { height: 22px; min-width: 2px; background: var(--c-bar); border-radius: 4px; }
  .bar .val { font-weight: 600; font-size: 13px; white-space: nowrap; color: var(--c); }
  .pts .bar .fill { border: 1px solid rgba(0,0,0,.28); }
  .pts .bar .val { color: var(--ink); }
  .note { text-align: center; color: var(--muted); font-size: 14px; padding: 18px 8px; }
  .qhd { padding: 10px 6px; text-align: center; font-weight: 600; font-size: 15px; border-top: 1px solid var(--hair); background: var(--c-tint); border-radius: var(--radius-md) var(--radius-md) 0 0; }
  .pchart { display: block; width: 100%; height: auto; }

  /* Leaderboard */
  .lb h3, .wk h3, .hp h3, .wl h3, .la h3, .tp h3 { margin: 6px 0 4px; font-size: 24px; line-height: 30px; font-weight: 600; }
  .lb .sub, .hp .sub { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .lb .find { margin: 6px 0 12px; }
  .lb .find input { width: 260px; max-width: 100%; }
  .row { display: grid; grid-template-columns: 54px 1fr; align-items: center; border-bottom: 1px solid var(--hair); }
  .row .rk { font-weight: 600; padding: 4px 6px; }
  .row .track { position: relative; height: 26px; }
  .row .fill { position: absolute; left: 0; top: 2px; bottom: 2px; background: color-mix(in srgb, var(--green-bar) 45%, transparent); border-radius: 4px; }
  .row.paid .fill { background: var(--green-bar); }
  .row .nm { position: absolute; left: 8px; top: 3px; font-weight: 600; font-size: 14px; white-space: nowrap; max-width: 70%; overflow: hidden; text-overflow: ellipsis; }
  .row .am { position: absolute; right: 4px; top: 3px; font-size: 13px; font-weight: 600; padding: 0 4px; background: color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 4px; }
  .row.hl .nm { background: var(--amber); color: var(--on-accent); border-radius: 4px; padding: 0 4px; }
  .cut { border-top: 2px dashed var(--green); margin: 6px 0; color: var(--green); font-size: 13px; text-align: center; }

  /* Weekly Results */
  .wk .hint { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .wk .ctl, .hp .ctl { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin: 8px 0 14px; }
  .wk .ctl label { font-size: 14px; font-weight: 500; display: block; margin-bottom: 2px; }
  .wk .ctl input, .hp .ctl input { width: 240px; max-width: 100%; }
  .wk .ctl .picker { max-width: 100%; }
  .wk .split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); }
  @media (max-width: 860px) { .wk .split { grid-template-columns: 1fr; } }
  .wk .side-h { font-weight: 600; font-size: 16px; padding: 6px 0; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .wk .list { max-height: 560px; overflow-y: auto; }
  .wk .wrow { display: grid; grid-template-columns: 30px 1fr; align-items: center; cursor: pointer; border-bottom: 1px solid var(--hair); }
  .wk .wrow .rk { padding: 4px 4px; font-weight: 600; font-size: 13px; }
  .wk .wrow .track { position: relative; height: 26px; }
  .wk .wrow .fill { position: absolute; left: 0; top: 2px; bottom: 2px; background: color-mix(in srgb, var(--muted) 35%, transparent); border-radius: 4px; }
  .wk .wrow.sel .fill { background: var(--success); }
  .wk .wrow.sel .nm, .wk .wrow.sel .am { color: var(--on-success); }
  .wk .wrow .nm { position: absolute; left: 8px; top: 3px; font-weight: 600; font-size: 14px; white-space: nowrap; max-width: 62%; overflow: hidden; text-overflow: ellipsis; }
  .wk .wrow .am { position: absolute; right: 6px; top: 4px; font-size: 13px; }
  .wk .wrow.hl .nm { background: var(--amber); color: var(--on-accent); border-radius: 4px; padding: 0 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 13px; color: var(--muted); padding: 8px 4px; }
  .legend i { display: inline-block; width: 14px; height: 14px; margin-right: 4px; vertical-align: -3px; border: 1px solid rgba(0,0,0,.25); border-radius: 3px; }

  /* Winner List */
  .wl .wr { display: grid; grid-template-columns: minmax(180px, 38%) 1fr auto; gap: 12px; padding: 7px 8px; border-bottom: 1px solid var(--hair); }
  .wl .wr:nth-child(even) { background: color-mix(in srgb, var(--hair) 45%, transparent); }
  .wl .wr .ev { font-weight: 600; }
  .wl .wr .amt { color: var(--muted); font-size: 14px; }

  /* How Many Times Picked */
  .hp .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .hp .gh { font-size: 13px; color: var(--muted); text-align: center; border-bottom: 1px solid var(--border); padding: 2px 0 4px; margin-bottom: 4px; }
  .hp .hrow { position: relative; height: 26px; border-bottom: 1px solid var(--hair); }
  .hp .hfill { position: absolute; left: 0; top: 2px; bottom: 2px; border: 1px solid rgba(0,0,0,.25); border-radius: 4px; }
  .hp .hname { position: absolute; left: 6px; top: 3px; max-width: calc(100% - 40px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--ink); padding: 0 4px; border-radius: 4px; background: color-mix(in srgb, var(--surface) 35%, transparent); }
  .hp .hn { position: absolute; right: 2px; top: 3px; font-weight: 600; font-size: 13px; padding: 0 4px; background: color-mix(in srgb, var(--surface) 75%, transparent); border-radius: 4px; }
  .hp .hrow.hl { outline: 2px solid var(--accent-text); z-index: 1; }

  /* Lineup Analysis */
  .la h4 { margin: var(--space-5) 0 var(--space-2); font-size: 18px; line-height: 24px; font-weight: 600; }
  .la h4 span { color: var(--muted); font-weight: 400; }
  .la .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); margin-top: var(--space-3); }
  @media (max-width: 700px) { .la .stats { grid-template-columns: 1fr; } }
  .la .stat { background: var(--raised); border: 1px solid var(--hair); border-radius: var(--radius-md); padding: var(--space-4); text-align: center; }
  .la .stat .lbl { color: var(--muted); font-size: 15px; }
  .la .stat .num { font-size: 34px; line-height: 40px; font-weight: 700; }
  .la .ot { border-top: 1px solid var(--border); }
  .la .orow { display: grid; grid-template-columns: 34px minmax(150px, 1.3fr) 90px 1.7fr; gap: 10px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--hair); font-size: 14px; }
  .la .orow.head { color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); }
  .la .orow .rk { font-weight: 600; text-align: right; }
  .la .gcell { color: #121310; font-weight: 600; text-align: center; padding: 3px 8px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid rgba(0,0,0,.2); }
  .la .picks { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .la .otrack { display: flex; align-items: center; gap: 8px; }
  .la .ofill { height: 20px; border-radius: 4px; min-width: 2px; }
  .la .opct { font-weight: 600; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) { .la .orow { grid-template-columns: 26px minmax(120px, 1fr) 64px 1fr; gap: 6px; font-size: 13px; } }
  /* Top (paid) Teams */
  .tp .sub { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .tp .pies { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: var(--space-4); margin-top: var(--space-3); }
  .tp .pc { background: var(--raised); border: 1px solid var(--hair); border-radius: var(--radius-md); padding: var(--space-3); text-align: center; }
  .tp .pc .nm { font-weight: 600; font-size: 14px; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tp .pc .pay { color: var(--muted); font-size: 12px; margin-top: -4px; margin-bottom: 4px; }
  .tp .pc .am { color: var(--green); font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .tp .pc { position: relative; }
  .tp .pc.bubble { opacity: .45; }
  .tp .pc.first-out::before { content: ""; position: absolute; left: -10px; top: -4px; bottom: -4px; border-left: 2px dashed var(--green); }
  .tp .pc.below::after { content: ""; position: absolute; left: -8px; right: -8px; top: -10px; border-top: 2px dashed var(--green); }
  .tp .key { color: var(--green); font-size: 14px; margin-top: var(--space-3); }
  .tp .pc svg { width: 120px; height: 120px; display: block; margin: 0 auto; }
  .ftip { position: fixed; z-index: 50; display: none; pointer-events: none; max-width: 400px;
    background: var(--raised); color: var(--ink); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 8px 12px; font-size: 14px; line-height: 20px; }
  .ftip .t1 { font-weight: 700; margin-bottom: 2px; }
  .ftip .tl { color: var(--muted); }
  .ftip .ln { color: var(--muted); }
  .ftip .b { font-weight: 700; color: var(--ink); }
  .ftip .g { font-weight: 700; color: var(--success); font-size: 16px; }
  .ftip .gap { margin-top: 8px; }
  .bars .bar[data-tip] { cursor: default; }
  .ftip.wide { max-width: 470px; width: max-content; }
  .ftip .sent { color: var(--muted); font-size: 15px; line-height: 22px; max-width: 420px; }
  .ftip .sent b { color: var(--ink); } .ftip .sent .o { color: var(--accent-text); font-weight: 700; }
  .ftip .mch { text-align: center; margin-bottom: 8px; }
  .ftip .rk { text-align: center; }
  .ftip .rk .tn { font-size: 24px; line-height: 30px; font-weight: 700; }
  .ftip .rk .rl { color: var(--muted); } .ftip .rk .rl b { color: var(--ink); font-size: 20px; }
  .ftip .rk .ln2 { margin-top: 8px; font-weight: 600; } .ftip .rk .ln2 .g2 { color: var(--success); }
  .ftip .mch .frac { font-size: 28px; line-height: 34px; font-weight: 700; color: var(--muted); }
  .ftip .mch .frac .m { color: var(--danger); }
  .ftip .mch .big { margin-top: 6px; }
  .ftip .big { color: var(--success); font-weight: 700; font-size: 20px; line-height: 28px; }
  .ptip .tn { font-size: 22px; line-height: 28px; font-weight: 700; }
  .ptip .tt { color: var(--muted); font-size: 16px; }
  .ptip .tt b, .ptip .kv .gv { color: var(--success); font-weight: 700; }
  .ptip .kv { display: grid; grid-template-columns: auto auto; gap: 0 14px; margin: 10px 0 10px 24px; color: var(--muted); }
  .ptip .kv .nmv { color: var(--ink); font-weight: 700; font-size: 17px; }
  .ptip .kv .pv { color: var(--ink); font-weight: 700; }
  .ptip .gr { display: grid; grid-template-columns: minmax(130px, 1fr) 54px 160px; gap: 8px; align-items: center; font-size: 13px; padding: 2px 0; border-bottom: 1px solid var(--hair); }
  .ptip .gr.h { color: var(--muted); border-bottom: 1px solid var(--border); }
  .ptip .gr.on { font-weight: 700; background: color-mix(in srgb, var(--hair) 55%, transparent); }
  .ptip .gr .pt { text-align: center; }
  .ptip .gbar { position: relative; height: 18px; }
  .ptip .gbar i { position: absolute; left: 0; top: 1px; bottom: 1px; border: 1px solid rgba(0,0,0,.3); border-radius: 3px; }
  .ptip .gbar span { position: absolute; right: 4px; top: 0; }
  /* Team Performance */
  .tpf .phd { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3);
    background: var(--raised); border: 1px solid var(--hair); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
  .tpf .phd h3 { margin: 0; font-size: 28px; line-height: 34px; font-weight: 500; }
  .tpf .phd h3 b { font-weight: 700; }
  .tpf .phd .ctl { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
  .tpf .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-pill); overflow: hidden; }
  .tpf .seg button { font: 500 15px/20px var(--sans); background: transparent; color: var(--ink); border: 0; padding: 7px 16px; cursor: pointer; }
  .tpf .seg button.on { background: var(--success); color: var(--on-success); font-weight: 600; }
  .tpf .picker { max-width: 240px; }
  .tpf .cards { display: grid; grid-template-columns: 180px 280px 1fr; gap: var(--space-4); margin: var(--space-4) 0; }
  @media (max-width: 860px) { .tpf .cards { grid-template-columns: 1fr 1fr; } .tpf .cards .trend { grid-column: 1 / -1; } }
  .tpf .kc { background: var(--green-tint); border: 1px solid var(--hair); border-radius: var(--radius-md); padding: var(--space-3); text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .tpf .kc .lbl { color: var(--muted); font-size: 15px; }
  .tpf .kc .num { font-size: 44px; line-height: 50px; font-weight: 700; }
  .tpf .kc .money { font-size: 36px; line-height: 44px; font-weight: 700; color: var(--green); }
  .tpf .trend { background: var(--raised); border: 1px solid var(--hair); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); }

  // ---- prizes (rules sheet): winner gets $150, $200 at The Players and Signature Events, $300 at Majors plus $100 for 2nd ----

  // Higher-paying events by name, used when the Sheet's Schedule tab has no type yet (or says regular).

    "at&t pebble beach pro-am": "signature", "the genesis invitational": "signature", "cadillac championship": "signature",
    "arnold palmer invitational presented by mastercard": "signature", "rbc heritage": "signature", "truist championship": "signature",

  function prizeText(type) {

  function prizesFor(earned, prizes) {   // same rule as the Sheet: ties share the prizes for the places they occupy

  function money2(n) { return "$" + (Math.round(n) === n ? n.toLocaleString("en-US") : n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })); }

  // ---- schedule helpers ----
  function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

  function nextEvent() {

  function build() {
    (D.schedule || []).forEach(function (e) { e.type = resolveType(e.event, e.type); });
    var ev = {};
    D.results.forEach(function (r) {

      .sort(function (a, b) { return (a.date || "~") < (b.date || "~") ? -1 : (a.date || "~") > (b.date || "~") ? 1 : a.name < b.name ? -1 : 1; });

    });
    if (D.eventScores.length && D.eventScores[0].prize == null) {   // older feed: work out prizes here

    var lineup = {};    // team -> [golfer]

    function pick(ev) {
      var m = svg.getScreenCTM && svg.getScreenCTM(); if (!m) return null;
      var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; pt = pt.matrixTransform(m.inverse());
      var i = 0; for (var k = 1; k < n; k++) if (Math.abs(x(k) - pt.x) < Math.abs(x(i) - pt.x)) i = k;
      var want = 1 + (pt.y - T) / Math.max(1, H - T - B) * Math.max(1, N - 1), best = team, bd = Infinity;
      M.teams.forEach(function (t) {
        var d = Math.abs(hist[t.team][i] - want) - (t.team === team ? 0.5 : 0);   // the chosen team wins near-ties
        if (d < bd) { bd = d; best = t.team; }
      });
      return { i: i, team: best };
    }
    function show(ev) {
      var p = pick(ev); if (!p) return;
      var id = p.team + "|" + p.i;
      if (id !== last) {
        last = id; clearOutline();
        if (p.team !== team && n > 1) {
          outlineEl = svgEl(svg, "polyline", { points: hist[p.team].map(function (r, j) { return x(j).toFixed(1) + "," + y(r).toFixed(1); }).join(" "),
            fill: "none", stroke: theme() === "dark" ? "#f2eee8" : "#121310", "stroke-width": "2.5", "pointer-events": "none" });
        }
        showTipNode(rankTip(p.team, p.i, hist[p.team][p.i]), ev.clientX, ev.clientY);
      } else if (tipEl) placeTip(ev.clientX, ev.clientY);
    }
    hit.addEventListener("mousemove", show);
    hit.addEventListener("mouseleave", function () { last = ""; hideTip(); });
    hit.addEventListener("click", function (ev) { ev.stopPropagation(); last = ""; show(ev); });
    var wr = el("div", "wr"); wr.appendChild(svg); box.appendChild(wr);
    box.appendChild(el("div", "cap", "Orange: " + team + ". Grey: every other team. Green band: the payout spots (top " + pc.n + ")."));
  }

  function perfStats(box, team) {
    var grid = el("div", "sgph");
    var p1 = el("div", "panel grey"); p1.appendChild(el("h5", null, "Total Earnings this season"));
    if (!D.closed) p1.appendChild(lineupsNote()); else p1.appendChild(bars(golferBars(team, null), false, golferTip(null)));
    var p2 = el("div", "panel"); p2.appendChild(el("h5", null, "Strokes gained"));
    p2.appendChild(el("div", "note", "Strokes Gained Total trend, Long Game vs Short Game, and Recent Performance arrive once the DataGolf stats are connected. The earnings bars will then take the colour of each golfer's strokes gained group."));
    grid.appendChild(p1); grid.appendChild(p2); box.appendChild(grid);
  }

  // ---- Past Finishes ----
  // Finish colours: purple, darker = better. Missed cuts and withdrawals are grey.
  function finishStyle(f) {
    var F = String(f || "").toUpperCase();
    if (!F) return null;
    if (MISSED[F]) return { bg: theme() === "dark" ? "#3a3733" : "#e3dfd8", fg: tc().axis, txt: F === "W/D" || F === "WD" ? "WD" : F };
    var p = parseInt(F.replace(/^T/, ""), 10);
    if (isNaN(p)) return { bg: "transparent", fg: tc().axis, txt: F };
    if (p === 1) return { bg: "#4b0a7d", fg: "#ffffff", txt: F };
    if (p <= 5) return { bg: "#7a3fb0", fg: "#ffffff", txt: F };
    if (p <= 10) return { bg: "#a77bd0", fg: "#121310", txt: F };
    if (p <= 25) return { bg: "#cdb6e6", fg: "#121310", txt: F };
    return { bg: "#ebe1f5", fg: "#121310", txt: F };
  }
  function pastFinishes(view) {
    var box = el("div", "pfn");
    box.appendChild(el("h3", null, "Past Finishes"));
    box.appendChild(el("div", "sub", "Only FGT-season events are included. Hover a finish for details."));
    if (!M.events.length) { box.appendChild(el("div", "note", "No results yet.")); view.appendChild(box); return; }
    var pts = {}; D.golfers.forEach(function (g) { pts[key(g.golfer)] = g.points; });
    D.lineups.forEach(function (l) { if (pts[key(l.golfer)] == null) pts[key(l.golfer)] = l.points; });
    // Golfers on the points list, or picked, who played at least one event; most money first.
    var keys = {};
    Object.keys(M.finish).forEach(function (ev) { Object.keys(M.finish[ev]).forEach(function (k) { if (pts[k] != null) keys[k] = 1; }); });
    var rows = Object.keys(keys).map(function (k) { return { k: k, name: M.names[k] || k, pts: pts[k], money: M.golferSeason[k] || 0 }; })
      .sort(function (a, b) { return b.money - a.money || a.name.localeCompare(b.name); });

    var ctl = el("div", "ctl"), inp = el("input"); inp.type = "search"; inp.placeholder = "Highlight golfer"; inp.value = state.pfFind || "";
    ctl.appendChild(inp);
    var keyEl = el("div", "key");
    [["1", "Win"], ["T3", "2-5"], ["T8", "6-10"], ["T18", "11-25"], ["T40", "26+"], ["CUT", "Missed cut / WD"]].forEach(function (x) {
      var st = finishStyle(x[0]), sp = el("span"), sw = el("i"); sw.style.background = st.bg; sp.appendChild(sw); sp.appendChild(document.createTextNode(x[1])); keyEl.appendChild(sp);
    });
    ctl.appendChild(keyEl); box.appendChild(ctl);

    var sc = el("div", "scroll"), tbl = el("table"), thead = el("thead"), hr = el("tr");
    hr.appendChild(el("th", "g", "Golfer")); hr.appendChild(el("th", null, "Points")); hr.appendChild(el("th", null, "Total Earnings"));
    M.events.forEach(function (e, i) { var th = el("th", null, String(i + 1)); th.title = e.name; hr.appendChild(th); });
    thead.appendChild(hr); tbl.appendChild(thead);
    var tb = el("tbody"), trs = [];
    rows.forEach(function (r, ri) {
      var tr = el("tr"); tr.appendChild(el("td", "g", r.name)); tr.appendChild(el("td", "num", String(r.pts)));
      tr.appendChild(el("td", "num", money(r.money)));
      M.events.forEach(function (e, ei) {
        var st = finishStyle((M.finish[e.name] || {})[r.k]), td = el("td", "fc", st ? st.txt : "");
        if (st) { td.style.background = st.bg; td.style.color = st.fg; td.setAttribute("data-r", ri); td.setAttribute("data-e", ei); }
        tr.appendChild(td);
      });
      tb.appendChild(tr); trs.push(tr);
    });
    tbl.appendChild(tb); sc.appendChild(tbl); box.appendChild(sc);
    if (!rows.length) box.appendChild(el("div", "note", "No golfers from the points list have results yet."));

    // One listener for the whole grid (hundreds of cells).
    tbl.addEventListener("mouseover", function (ev) {
      var td = ev.target.closest && ev.target.closest("td.fc[data-r]"); if (!td) { hideTip(); return; }
      var r = rows[+td.getAttribute("data-r")], e = M.events[+td.getAttribute("data-e")];
      showTip([r.name, ["Event", (+td.getAttribute("data-e") + 1) + ". " + e.name], ["Finish", (M.finish[e.name] || {})[r.k] || "-"],
        ["Earned", money((M.golferEvent[e.name] || {})[r.k] || 0)], ["Points", String(r.pts)]], ev.clientX, ev.clientY);
    });
    tbl.addEventListener("mousemove", function (ev) { if (tipEl && tipEl.style.display === "block") placeTip(ev.clientX, ev.clientY); });
    tbl.addEventListener("mouseleave", hideTip);
    tbl.addEventListener("click", function (ev) { var td = ev.target.closest && ev.target.closest("td.fc[data-r]"); if (td) { ev.stopPropagation(); td.dispatchEvent(new MouseEvent("mouseover", { bubbles: true, clientX: ev.clientX, clientY: ev.clientY })); } });
    function paint() {
      var q = key(state.pfFind || "").trim(), first = null;
      trs.forEach(function (tr, i) { var on = q && key(rows[i].name).indexOf(q) >= 0; tr.classList.toggle("hl", !!on); if (on && !first) first = tr; });
      if (first && first.scrollIntoView) first.scrollIntoView({ block: "nearest" });
    }
    inp.oninput = function () { state.pfFind = inp.value; paint(); };
    paint();
    view.appendChild(box);
  }

  // How many teams picked each golfer, most-picked first.
  function pickCounts() {
    var by = {};
    D.lineups.forEach(function (l) {
      var k = key(l.golfer), g = by[k] || (by[k] = { name: l.golfer, points: l.points, n: 0 });
      g.n++;
    });
    return Object.keys(by).map(function (k) { return by[k]; })
      .sort(function (a, b) { return b.n - a.n || a.name.localeCompare(b.name); });
  }

  function lineupAnalysis(view) {
    var box = el("div", "la");
    box.appendChild(el("h3", null, "Lineup Analysis"));
    if (!D.closed) { box.appendChild(lineupsNote()); view.appendChild(box); return; }
    var list = pickCounts();
    var teamSet = {}; D.lineups.forEach(function (l) { teamSet[l.team] = 1; });
    var nTeams = Object.keys(teamSet).length || M.teams.length;
    var once = list.filter(function (g) { return g.n === 1; }).length;

    var stats = el("div", "stats");
    [["Teams entered", nTeams], ["Different golfers picked", list.length], ["Golfers picked only once", once]].forEach(function (x) {
      var c = el("div", "stat"); c.appendChild(el("div", "lbl", x[0])); c.appendChild(el("div", "num", String(x[1]))); stats.appendChild(c);
    });
    box.appendChild(stats);

    var h = el("h4", null, "Ownership % "); h.appendChild(el("span", null, "Top 25 most picked golfers")); box.appendChild(h);
    var t = el("div", "ot");
    var head = el("div", "orow head");
    ["", "Golfer (pts)", "Picked / teams", "Ownership %"].forEach(function (x) { head.appendChild(el("div", null, x)); });
    t.appendChild(head);
    var top = list.slice(0, 25), max = top.length ? top[0].n : 1;
    top.forEach(function (g, i) {
      var r = el("div", "orow");
      r.appendChild(el("div", "rk", String(i + 1)));
      var gc = el("div", "gcell", g.name + " (" + g.points + " pts)"); gc.style.background = PT[g.points] || "#ddd"; r.appendChild(gc);
      r.appendChild(el("div", "picks", g.n + " / " + nTeams));
      var pct = nTeams ? g.n / nTeams : 0;
      var tr = el("div", "otrack"), f = el("div", "ofill");
      f.style.width = Math.max(1, Math.round(pct * 88)) + "%";
      f.style.background = mix("#f6e3a1", "#9b1239", max ? g.n / max : 0);   // heat: pale gold = few picks, deep red = most
      tr.appendChild(f); tr.appendChild(el("div", "opct", (pct * 100).toFixed(1) + "%")); r.appendChild(tr);
      t.appendChild(r);
    });
    if (!top.length) t.appendChild(el("div", "note", "No lineups yet."));
    box.appendChild(t);
    view.appendChild(box);
  }

  function picked(view) {
    var box = el("div", "hp");
    box.appendChild(el("h3", null, "How many times was each golfer picked?"));
    if (!D.closed) { box.appendChild(lineupsNote()); view.appendChild(box); return; }
    var list = pickCounts();
    box.appendChild(el("div", "sub", M.teams.length + " teams entered, " + list.length + " different golfers picked."));
    var ctl = el("div", "ctl"), inp = el("input"); inp.type = "search"; inp.placeholder = "Highlight golfer"; inp.value = state.hFind || "";
    ctl.appendChild(inp); ctl.appendChild(legend()); box.appendChild(ctl);
    var grid = el("div", "grid"); box.appendChild(grid);
    var max = list.length ? list[0].n : 1;
    function paint() {
      clear(grid);
      var q = key(state.hFind || "").trim();
      for (var i = 0; i < list.length; i += 25) {
        var colEl = el("div"), chunk = list.slice(i, i + 25);
        colEl.appendChild(el("div", "gh", "#" + (i + 1) + " - " + (i + chunk.length)));
        chunk.forEach(function (g) {
          var r = el("div", "hrow" + (q && key(g.name).indexOf(q) >= 0 ? " hl" : ""));
          var f = el("div", "hfill"); f.style.width = Math.max(4, Math.round(g.n / max * 100)) + "%";
          f.style.background = PT[g.points] || "#ddd";
          r.appendChild(f); r.appendChild(el("div", "hname", g.name)); r.appendChild(el("div", "hn", String(g.n)));
          colEl.appendChild(r);
        });
        grid.appendChild(colEl);
      }
      if (!list.length) grid.appendChild(el("div", "note", "No lineups yet."));
    }
    inp.oninput = function () { state.hFind = inp.value; paint(); };
    paint();
    view.appendChild(box);
  }

  function schedule(view) {
    var box = el("div", "sch");
    box.appendChild(el("h3", null, "2027 Schedule"));
    var sub = el("div", "sub");
    sub.appendChild(document.createTextNode("Weekly prizes: $150 to the winning team at a regular event. "));
    sub.appendChild(flag());
    sub.appendChild(document.createTextNode(" Starred events pay more: $200 at The Players, Signature Events and the FedExCup Playoffs; $300 to the winner of a Major and $100 for 2nd. Events on the same weekend are scored separately."));
    box.appendChild(sub);
    var list = (D.schedule || []).slice().sort(function (a, b) { return a.finish < b.finish ? -1 : a.finish > b.finish ? 1 : 0; });
    if (!list.length) { box.appendChild(el("div", "note", "The schedule has not been loaded yet.")); view.appendChild(box); return; }
    var done = {}; M.events.forEach(function (e) { done[e.name.toLowerCase()] = 1; });
    var nx = nextEvent(), head = el("div", "srow head");
    ["#", "", "Event", "Dates", "Type", "Purse", "Status"].forEach(function (x, j) { head.appendChild(el("div", j === 5 ? "num" : null, x)); });
    box.appendChild(head);
    var n = 0;
    list.forEach(function (e) {
      var counts = e.counts !== "No", scored = done[e.event.toLowerCase()];
      var r = el("div", "srow" + (nx && e.event === nx.event ? " next" : "") + (counts ? "" : " off") + (counts && higher(e.type) ? " hp" : ""));
      r.appendChild(el("div", null, counts && e.counts !== "TBD" ? String(++n) : ""));
      var star = el("div", "star"); if (counts && higher(e.type)) star.appendChild(flag()); r.appendChild(star);
      r.appendChild(el("div", "ev", e.event));
      r.appendChild(el("div", null, dateRange(e.finish)));
      var tcell = el("div"); tcell.appendChild(el("span", "pzb " + e.type, TYPE_NAME[e.type] || "Regular"));
      if (counts) tcell.appendChild(el("div", "st", prizeText(e.type))); r.appendChild(tcell);
      r.appendChild(el("div", "num", e.purse ? money(e.purse) : "TBA"));
      var st = el("div", "st");
      if (!counts) st.textContent = "Not part of the FGT";
      else if (e.counts === "TBD") st.textContent = "Event to be announced";
      else if (scored) {
        var top = (M.perEvent[e.event] || []).filter(function (x) { return x.rank === 1 && x.earnings > 0; });
        st.appendChild(document.createTextNode("Won by ")); st.appendChild(el("b", null, top.map(function (x) { return x.team; }).join(" & ") || "-"));
      } else st.textContent = nx && e.event === nx.event ? "Next up" : "Upcoming";
      r.appendChild(st); box.appendChild(r);
    });
    view.appendChild(box);
  }

  var TABS = [["tracker", "Main", tracker], ["weekly", "Weekly Results", weekly],
              ["leaderboard", "Leaderboard", leaderboard], ["top", "Top Teams", topTeams], ["perf", "Team Performance", teamPerformance], ["winners", "Winner List", winners],
              ["picked", "How Many Times Picked?", picked], ["finishes", "Past Finishes", pastFinishes],
              ["lineups", "Lineup Analysis", lineupAnalysis], ["schedule", "Schedule", schedule]];
  var GROUPS = [["Season", ["tracker", "leaderboard", "top", "schedule"]], ["Weekly", ["weekly", "winners"]],
                ["Teams", ["perf"]], ["Golfers", ["picked", "finishes", "lineups"]]];
  var lastInGroup = {};
  function groupOf(tab) { return GROUPS.filter(function (g) { return g[1].indexOf(tab) >= 0; })[0] || GROUPS[0]; }
  function tabLabel(id) { return TABS.filter(function (t) { return t[0] === id; })[0][1]; }
  function draw() {
    hideTip();
    myBar();
    var nav = document.getElementById("nav"); clear(nav);
    var g = groupOf(state.tab); lastInGroup[g[0]] = state.tab;
    var row = el("div", "grp");
    GROUPS.forEach(function (gr) {
      var b = el("button", gr === g ? "on" : "", gr[0]); b.type = "button";
      b.onclick = function () { state.tab = lastInGroup[gr[0]] || gr[1][0]; draw(); };
      row.appendChild(b);
    });
    nav.appendChild(row);
    if (g[1].length > 1) {
      var sub = el("div", "sub");
      g[1].forEach(function (id) {
        var b = el("button", state.tab === id ? "on" : "", tabLabel(id)); b.type = "button";
        b.onclick = function () { state.tab = id; draw(); };
        sub.appendChild(b);
      });
      nav.appendChild(sub);
    }
    var view = document.getElementById("view"); clear(view);
    TABS.filter(function (t) { return t[0] === state.tab; })[0][2](view);
  }
  function footer() {
    if (D && D.generated) document.getElementById("foot").textContent = "Updated " + new Date(D.generated).toLocaleString() + ". Earnings are official PGA Tour prize money.";
  }
  function start() {
    M = build();
    clear(document.getElementById("banners"));   // start() can run again when fresher data arrives
    if (D.demo) $b("demo", "DEMO DATA: 40 made-up teams, and real Austin Championship money (the other two events, including Demo Major, are invented).");
    var t = C.TITLE || "2027 PGA Fantasy Golf Tour";
    document.getElementById("title").textContent = t.replace(/PGA Fantasy Golf Tour/i, "Fantasy Golf Tour") + " Tracker";
    if (!D.closed) $b("info", "Entries are still open, so team lineups are hidden. They appear once entries close.");
    footer();
    draw();
  }
  load();
})();
