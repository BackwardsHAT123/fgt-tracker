<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Golf Tour</title>
<meta name="description" content="The PGA Fantasy Golf Tour: pick your team and follow the 2027 season.">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="favicon.png">
<script>
  /* Theme: the visitor's own choice (saved by the toggle) wins; otherwise follow the device's light/dark setting;
     devices with no setting get light. */
  (function () {
    var t = null;
    try { var v = localStorage.getItem("fgt-theme"); if (v === "light" || v === "dark") t = v; } catch (e) {}
    if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
  /* TAH design system tokens (same as team-picker.html and dashboard.html). */
  :root {
    color-scheme: dark;
    --surface: #262524; --raised: #1c1a17; --ink: #f2eee8; --muted: #b3b2ae;
    --hair: #3a3733; --border: #8a877d;
    --accent: #ed7437; --on-accent: #121310; --accent-text: #ed7437;
    --sans: "Outfit", "Avenir Next", system-ui, sans-serif;
    --radius-md: 12px; --radius-pill: 999px;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --surface: #f2eee8; --raised: #fbf9f5; --ink: #121310; --muted: #5a574e;
    --hair: #d9d3c8; --border: #8d887b; --accent-text: #a8420f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 400 16px/24px var(--sans);
    display: flex; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 16px; gap: 28px; }
  .logo { width: 240px; height: 240px; max-width: 70vw; max-height: 70vw; border-radius: 24px; display: block; }
  h1 { margin: 0; font-size: 44px; line-height: 50px; font-weight: 700; letter-spacing: -0.5px; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 18px; }
  .buttons { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 380px; }
  .big { display: flex; align-items: center; justify-content: center; min-height: 72px; padding: 14px 28px;
    border-radius: var(--radius-pill); font: 600 26px/32px var(--sans); text-decoration: none; }
  .big.primary { background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); }
  .big.secondary { background: transparent; color: var(--ink); border: 2px solid var(--border); }
  .big.secondary:hover { border-color: var(--ink); }
  .big.primary:hover { filter: brightness(1.06); }
  .big:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 3px; }
  .nextup { color: var(--muted); font-size: 16px; line-height: 22px; max-width: 520px; }
  .nextup b { color: var(--ink); font-weight: 600; }
  .hpf { display: inline-block; margin-left: 6px; font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: #eaa945; color: #121310; white-space: nowrap; }
  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 16px; }
  footer b { color: var(--ink); font-weight: 600; }
  @media (max-width: 600px) { h1 { font-size: 32px; line-height: 38px; } .big { font-size: 22px; min-height: 64px; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo-480.jpg" width="240" height="240" alt="Fantasy Golf Tour logo">
  <div>
    <h1 id="title">PGA Fantasy Golf Tour</h1>
    <p class="sub" id="deadline"></p>
  </div>
  <p class="nextup" id="nextup" hidden></p>
  <nav class="buttons" aria-label="Main">
    <a class="big primary" href="team-picker.html">Team Picker</a>
    <a class="big secondary" href="dashboard.html">2027 Tracker</a>
  </nav>
</main>
<footer>Questions? <b>FGT_MT@outlook.com</b></footer>
<script src="config.js"></script>
<script>
  // Title and entry deadline come from config.js, so they match the team picker.
  (function () {
    var C = window.FGT_CONFIG || {};
    if (C.TITLE) document.getElementById("title").textContent = C.TITLE;
    if (C.DEADLINE_TEXT) document.getElementById("deadline").textContent = C.DEADLINE_TEXT;
  })();
  // "Next up": the next FGT event, from the dashboard snapshot published with the site.
  (function () {
    var PRIZE = { regular: "$150 to the winning team", signature: "$200 to the winning team", players: "$200 to the winning team",
                  major: "$300 to the winning team, $100 for 2nd" };
    var KNOWN = { "masters tournament": "major", "pga championship": "major", "u.s. open": "major", "the open championship": "major",
      "the players championship": "players", "at&t pebble beach pro-am": "signature", "the genesis invitational": "signature",
      "cadillac championship": "signature", "arnold palmer invitational presented by mastercard": "signature", "rbc heritage": "signature",
      "truist championship": "signature", "the memorial tournament presented by workday": "signature", "travelers championship": "signature" };
    fetch("data/dashboard.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      var done = {}; (d.results || []).forEach(function (r) { done[String(r.event).toLowerCase()] = 1; });
      var now = new Date(), t = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
      var n = (d.schedule || []).filter(function (e) { return e.counts !== "No" && e.counts !== "TBD" && !done[e.event.toLowerCase()] && e.finish >= t; })
        .sort(function (a, b) { return a.finish < b.finish ? -1 : 1; })[0];
      if (!n) return;
      var f = new Date(n.finish + "T12:00:00"), st = new Date(f.getTime() - 3 * 86400000);
      var mo = function (x) { return x.toLocaleString("en-US", { month: "short" }); };
      var dates = mo(st) === mo(f) ? mo(st) + " " + st.getDate() + "-" + f.getDate() : mo(st) + " " + st.getDate() + " - " + mo(f) + " " + f.getDate();
      var p = document.getElementById("nextup");
      p.appendChild(document.createTextNode("Next up: "));
      var b = document.createElement("b"); b.textContent = n.event; p.appendChild(b);
      var ty = PRIZE[n.type] && n.type !== "regular" ? n.type : (KNOWN[n.event.trim().toLowerCase()] || "regular");
      p.appendChild(document.createTextNode(", " + dates + ". " + PRIZE[ty] + "."));
      if (ty !== "regular") { var f = document.createElement("span"); f.className = "hpf"; f.textContent = "\u2605 Higher payout"; p.appendChild(f); }
      p.hidden = false;
    }).catch(function () {});
  })();
</script>
<script>
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
    var saved = null; try { saved = localStorage.getItem("fgt-theme"); } catch (x) {}
    if (!saved) document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light");
  });
</script>
</body>
</html>
