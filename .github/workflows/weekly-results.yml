name: Weekly results

# Pulls each finished FGT event's results from pgatour.com, sends them to the Google Sheet, refreshes the dashboard
# snapshot, and republishes the site. Runs Sunday 4pm, Sunday evening and night, Monday 4:44am and Monday evening (for late or weather-delayed
# finishes, and because pgatour.com's past-results page with the money often lags behind the event going official).
# Re-sending an event replaces its rows, so extra runs are harmless. Needs the repo secret FGT_RESULTS_TOKEN.
# The Sheet's script (FGT > Turn on the live and results timer) starts this job on time; these GitHub schedules
# (often hours late on weekends, so set a few minutes past the hour) are the backup.
on:
  schedule:
    # GitHub runs on UTC (no daylight saving). For a fixed Mountain time, a pair of lines one hour apart both fire
    # and the job skips the one that is wrong for the time of year (first line = summer time, second = winter).
    - cron: "7 22 * * 0"    # Sunday 4pm Mountain (summer)
    - cron: "7 23 * * 0"    # Sunday 4pm Mountain (winter)
    - cron: "44 10 * * 1"   # Monday 4:44am Mountain (summer)
    - cron: "44 11 * * 1"   # Monday 4:44am Mountain (winter)
    - cron: "7 1 * * 1"    # Sunday ~6-7pm Mountain
    - cron: "7 4 * * 1"    # Sunday ~9-10pm Mountain
    - cron: "7 1 * * 2"    # Monday evening (Monday finishes)
  workflow_dispatch:
    inputs:
      event:
        description: "Load one event by its exact Schedule name (leave blank for 'finished in the last few days')"
        required: false
      days:
        description: "How many days back to look"
        required: false
        default: "3"
      check:
        description: "Only test the token (resends the schedule, changes no results)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull results and send them to the Sheet
        env:
          FGT_RESULTS_TOKEN: ${{ secrets.FGT_RESULTS_TOKEN }}
          EVENT: ${{ inputs.event }}
          DAYS: ${{ inputs.days || '3' }}
          CHECK: ${{ inputs.check }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Paired lines (fixed Mountain time): run only the one that matches the time of year (summer -0600, winter -0700).
          OFF=$(TZ=America/Denver date +%z)
          case "$SCHEDULE" in
            "7 22 * * 0"|"44 10 * * 1") WANT=-0600 ;;
            "7 23 * * 0"|"44 11 * * 1") WANT=-0700 ;;
            *) WANT="$OFF" ;;
          esac
          if [ "$OFF" != "$WANT" ]; then echo "This line is the other half of a summer/winter pair; skipping."; exit 0; fi
          if [ "$CHECK" = "true" ]; then node tools/weekly-update.js --check; exit $?; fi
          if [ -n "$EVENT" ]; then node tools/weekly-update.js --event "$EVENT"; else node tools/weekly-update.js --days "$DAYS"; fi
      - name: Refresh DataGolf strokes gained (site/data/sg.json)
        # Skips itself if the DATAGOLF_KEY secret is missing; a DataGolf problem never blocks the results commit.
        continue-on-error: true
        env:
          DATAGOLF_KEY: ${{ secrets.DATAGOLF_KEY }}
        run: node tools/datagolf.js
      - name: Commit the new snapshot and republish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- site/data/dashboard.json site/data/sg.json; then echo "Snapshot and stats unchanged."; exit 0; fi
          git config user.name "fgt-results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/dashboard.json site/data/sg.json
          git commit -m "Update dashboard snapshot and stats after results"
          git pull --rebase
          git push
          gh workflow run pages.yml
